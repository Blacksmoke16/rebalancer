version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"

    # Minor and patch updates share one pull request; each major update gets
    # its own so a breaking change doesn't hold up the rest.
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

    groups:
      github-actions:
        patterns:
          - "*"
